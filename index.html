<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JM Eventos - Gestão Profissional</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="theme-color" content="#0a0a0a">
</head>
<body>

<div id="tela-login" class="login-overlay">
  <div class="login-box">
    <img src="/icon.png" alt="JM Eventos" class="login-logo">
    <h2>JM EVENTOS</h2>
    <p>Acesso Restrito à Administração</p>
    <input type="password" id="input-senha" inputmode="numeric" placeholder="••••" autocomplete="off">
    <button type="button" id="btn-entrar" class="btn-gold">Desbloquear Agenda</button>
    <p id="erro-senha" class="erro-msg">Senha incorreta. Tente novamente.</p>
  </div>
</div>
